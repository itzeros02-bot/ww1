name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Run unit tests
        run: uv run pytest tests/unit -q
        env:
          # Keep .env defaults out of the picture: assert true built-in defaults
          DATABASE_HOST: ""
          DATABASE_PORT: ""
          OBSERVABILITY_LOG_FORMAT: ""

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Run adversarial security suite (no DB required)
        run: uv run pytest tests/security -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blog_small
          POSTGRES_USER: enterprisedb
          POSTGRES_PASSWORD: postgres
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready -U enterprisedb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Load blog_small fixture
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5444 -U enterprisedb -d blog_small \
            -f fixtures/01_small_db.sql
      - name: Run integration tests against real PostgreSQL
        run: uv run pytest tests/integration -q
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: "5444"
          DATABASE_NAME: blog_small
          DATABASE_USER: enterprisedb
          DATABASE_PASSWORD: postgres

  coverage:
    runs-on: ubuntu-latest
    needs: [unit, security, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Full run with coverage
        run: uv run pytest tests/unit tests/security tests/integration -q --cov=src --cov-report=term --cov-report=xml
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: "5444"
          DATABASE_NAME: blog_small
          DATABASE_USER: enterprisedb
          DATABASE_PASSWORD: postgres
      - name: Enforce coverage gate
        run: uv run coverage report --fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
